<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark" />

    <title>Nike Shox — Engineered for Impact | Cinematic 3D Product Experience</title>
    <meta
      name="description"
      content="An interactive 3D product experience for Nike Shox. Explore the full-length Shox column array, the rib-cage upper and four colorways in real time, then pick your size."
    />
    <meta name="author" content="Shox Experience" />
    <link rel="canonical" href="https://shox.experience/" />

    <meta property="og:type" content="product" />
    <meta property="og:site_name" content="Nike Shox — Shox Experience" />
    <meta property="og:title" content="Nike Shox — Engineered for Impact" />
    <meta
      property="og:description"
      content="A cinematic, scroll-driven 3D experience built around the Nike Shox column array. Rotate it, light it, recolour it, buy it."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nike Shox sneaker rendered in 3D against a dark studio backdrop" />
    <meta property="og:url" content="https://shox.experience/" />
    <meta property="product:price:amount" content="199" />
    <meta property="product:price:currency" content="USD" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nike Shox — Engineered for Impact" />
    <meta
      name="twitter:description"
      content="A cinematic, scroll-driven 3D experience built around the Nike Shox column array."
    />
    <meta name="twitter:image" content="/og.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preload" href="/fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/roboto-mono-variable.woff2" as="font" type="font/woff2" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Nike Shox TL",
        "description": "Full-length Shox column cushioning under a rib-cage upper. Engineered for impact.",
        "brand": { "@type": "Brand", "name": "Nike" },
        "offers": {
          "@type": "Offer",
          "priceCurrency": "USD",
          "price": "199.00",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>

    <script>
      document.documentElement.classList.remove('no-js')
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div class="noscript-shell">
        <h1>Nike Shox</h1>
        <p><strong>Engineered for impact.</strong></p>
        <p>
          This experience renders the shoe in real-time 3D and needs JavaScript. The product itself:
          Nike Shox TL, full-length Shox column cushioning, rib-cage upper, $199. Available in Black,
          Summit White, Metallic Silver and Crimson Flash, EU sizes 40&ndash;45.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
