<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Shox">
  <!--
    Four Shox columns between two plates — the same idea the 3D scene is built
    around, reduced to the smallest mark that still reads at 16px. Original
    geometry: no third-party logo, wordmark or swoosh.
  -->
  <rect width="32" height="32" rx="7" fill="#040507" />
  <g fill="#ff2d16">
    <!-- top plate -->
    <rect x="6" y="8" width="20" height="2.6" rx="1.3" />
    <!-- columns: waisted, so they read as springs rather than bars -->
    <path d="M9 11.4h2.6v2.1l-1 2.5 1 2.5v2.1H9v-2.1l1-2.5-1-2.5z" />
    <path d="M14.1 11.4h2.6v2.1l-1 2.5 1 2.5v2.1h-2.6v-2.1l1-2.5-1-2.5z" />
    <path d="M19.2 11.4h2.6v2.1l-1 2.5 1 2.5v2.1h-2.6v-2.1l1-2.5-1-2.5z" />
    <path d="M24.3 11.4h1.7v2.1l-1 2.5 1 2.5v2.1h-1.7v-2.1l1-2.5-1-2.5z" opacity=".55" />
    <!-- bottom plate -->
    <rect x="6" y="21.4" width="20" height="2.6" rx="1.3" />
  </g>
</svg>
